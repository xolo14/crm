# Syncpedia CRM — http-level maps (goes in /etc/nginx/conf.d/, which Ubuntu's nginx.conf
# includes inside http { }). Public form/assessment/intro pages are embedded on partner
# websites via the <iframe> code from Form Management, so only those paths may be framed
# by other sites. Every other page (the CRM itself) can only be framed by this site.
# $request_uri (not $uri): the SPA fallback rewrites $uri to /index.html.
map $request_uri $crm_frame_options {
    ~^/(apply|doc-form/|assessment/|intro/)  "";
    default                                  "SAMEORIGIN";
}
map $request_uri $crm_frame_ancestors {
    ~^/(apply|doc-form/|assessment/|intro/)  "*";
    default                                  "'self'";
}
