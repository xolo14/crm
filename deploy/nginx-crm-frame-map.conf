# Syncpedia CRM — http-level maps (goes in /etc/nginx/conf.d/, which Ubuntu's nginx.conf
# includes inside http { }). Public form/assessment/intro pages are embedded on partner
# websites via the <iframe> code from Form Management, so only those paths may be framed
# by other sites. Every other page (the CRM itself) can only be framed by this site.
# $request_uri (not $uri): the SPA fallback rewrites $uri to /index.html.
map $request_uri $crm_frame_options {
    ~^/(apply|doc-form/|assessment/|intro/)  "";
    default                                  "SAMEORIGIN";
}
map $request_uri $crm_frame_ancestors {
    ~^/(apply|doc-form/|assessment/|intro/)  "*";
    default                                  "'self'";
}

# Google Tag Manager + Google Ads conversion tags load only on the public lead form and
# certificate pages (public/analytics-deferred.js). Every CRM page keeps the strict policy,
# so these hosts are added to the CSP only for /apply and /verify/.
map $request_uri $crm_analytics_script_src {
    ~^/(apply|verify/)  "https://www.googletagmanager.com https://*.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com";
    default             "";
}
map $request_uri $crm_analytics_connect_src {
    ~^/(apply|verify/)  "https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://*.doubleclick.net https://pagead2.googlesyndication.com";
    default             "";
}
map $request_uri $crm_analytics_frame_src {
    ~^/(apply|verify/)  "https://www.googletagmanager.com https://td.doubleclick.net https://bid.g.doubleclick.net";
    default             "";
}
