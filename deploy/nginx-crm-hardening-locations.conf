# Syncpedia CRM — files that must never be served. Include inside the crm.syncpedia.in
# server { } block, ABOVE the PHP location (nginx uses the first matching regex location):
#   include /etc/nginx/snippets/crm-hardening-locations.conf;

# Dotfiles (.htaccess, .env, .git …) — but keep /.well-known/ for Let's Encrypt renewals.
location ~ /\.(?!well-known/) {
    deny all;
}

# Build/dependency manifests and server-side folders.
location ~ ^/(composer\.(json|lock|phar)|package(-lock)?\.json|vendor/|php-backend/) {
    deny all;
}

# Include-only PHP: libraries and helpers that other endpoints require_once. They are never
# called from the browser; answering them directly only reveals the stack.
location ~ ^/api/(db|config|config\.example|bootstrap|helpers|email_phase_templates|payment_link_store|payment_link_fulfillment|razorpay_service|gcs_storage)\.php$ {
    deny all;
}
location ^~ /api/lib/ {
    deny all;
}
location ^~ /api/vendor/ {
    deny all;
}
