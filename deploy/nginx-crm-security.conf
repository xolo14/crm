# Syncpedia CRM — nginx response headers. Include inside the crm.syncpedia.in server { } block:
#   include /etc/nginx/snippets/crm-security.conf;
# Requires nginx-crm-frame-map.conf in /etc/nginx/conf.d/ (defines $crm_frame_*).
# Headers only — no location blocks (the server block owns those; see
# nginx-crm-hardening-locations.conf / nginx-crm-private-files.conf).

add_header X-Content-Type-Options "nosniff" always;
# Empty value for public embeddable pages (see nginx-crm-frame-map.conf) = header not sent.
add_header X-Frame-Options $crm_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera/microphone stay allowed for this site only: video intros record in the browser.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Enforced CSP (ran a day in Report-Only first). Scripts only from this site plus the
# third parties the app really loads: Razorpay checkout (/apply), Google sign-in, Facebook
# SDK (Meta Ads setup). Frames: Razorpay, Google, Facebook, YouTube/Vimeo/Drive embeds.
# Google tag hosts come from $crm_analytics_* (nginx-crm-frame-map.conf): /apply and /verify/ only.
# If something breaks, the browser console names the blocked URL — add that host here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://accounts.google.com https://connect.facebook.net $crm_analytics_script_src; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.razorpay.com https://accounts.google.com https://oauth2.googleapis.com https://graph.facebook.com https://*.facebook.com $crm_analytics_connect_src; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com https://www.facebook.com https://web.facebook.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com $crm_analytics_frame_src; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors $crm_frame_ancestors" always;
