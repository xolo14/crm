# Syncpedia CRM — nginx hardening. Include inside the crm.syncpedia.in server { } block:
#   include /etc/nginx/snippets/crm-security.conf;
# Requires nginx-crm-frame-map.conf in /etc/nginx/conf.d/ (defines $crm_frame_*).
# (nginx ignores the repo's .htaccess files, so these must live here.)

# --- Response headers -------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
# Empty value for public embeddable pages (see nginx-crm-frame-map.conf) = header not sent.
add_header X-Frame-Options $crm_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera/microphone stay allowed for this site only: video intros record in the browser.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Enforced now: the directives that cannot break the app (no embedding on other sites,
# no plugins, no <base> hijack).
add_header Content-Security-Policy "frame-ancestors $crm_frame_ancestors; object-src 'none'; base-uri 'self'" always;

# Full policy in report-only mode first: browsers log violations in the console but block
# nothing. After a week with no unexpected violations, rename the header to
# Content-Security-Policy (and drop the enforced one above, it is a subset).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com https://www.facebook.com https://web.facebook.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors $crm_frame_ancestors" always;
